name: Weekly Repo Review Summary Comment

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  security-events: read

jobs:
  weekly-review:
    uses: your-org/repo-review-automation/.github/workflows/repo-review.yml@main
    with:
      create_issues: false
      comment_mode: summary
      comment_issue_number: "42"
    secrets: inherit
