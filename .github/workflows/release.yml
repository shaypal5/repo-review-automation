name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read release version
        id: version
        run: |
          version=$(python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Unsupported release version: {version}")
          print(version)
          PY
          )
          major="${version%%.*}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "major_tag=v$major"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          status=$(gh api -i "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null | head -n 1 | cut -d' ' -f2)

          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            tag_sha=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)
            echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tag_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected response while checking tag existence: ${status:-unknown}" >&2
            exit 1
          fi

      - name: Create tag on pushed main commit
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$REPO/git/refs" \
            --method POST \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: gh release create "$TAG" --target "$SHA" --generate-notes --title "$TAG"

      - name: Move matching major tag
        if: steps.tag_check.outputs.exists == 'false' || steps.tag_check.outputs.tag_sha == github.sha
        env:
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG" "$SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force
