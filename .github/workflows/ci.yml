name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -r requirements-dev-lock.txt
          python -m pip install --no-deps -e .

      - name: Ruff
        shell: bash
        run: ruff check .

      - name: Pytest
        shell: bash
        run: pytest --cov=repo_review_automation --cov-branch --cov-report=xml --cov-report=term -q

      - name: Upload coverage XML artifact
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: repo-review-automation-coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q scripts tests repo_review_automation

      - name: Collector smoke test
        shell: bash
        run: |
          bash scripts/collect_signals.sh \
            --repo-root . \
            --paths . \
            --output-dir /tmp/repo-review-signals
          test -f /tmp/repo-review-signals/metadata.json
          test -f /tmp/repo-review-signals/file_inventory.txt

      - name: Context builder smoke test
        shell: bash
        run: |
          python scripts/build_review_context.py \
            --artifacts-dir /tmp/repo-review-signals \
            --repo-root . \
            --paths . \
            --review-mode full \
            --max-issues 5 \
            --prompt-preset default \
            --output /tmp/repo-review-context.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/repo-review-context.json").read_text(encoding="utf-8"))
          assert payload["repo"]["name"] == "repo-review-automation"
          assert "signals" in payload
          PY

  pr-agent-context:
    name: PR agent context
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [test]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: shaypal5/pr-agent-context/.github/workflows/pr-agent-context.yml@v4
    with:
      tool_ref: v4
      target_patch_coverage: "100"
      include_review_comments: true
      include_failing_checks: true
      include_patch_coverage: true
      patch_coverage_source_mode: coverage_xml_artifact
      coverage_report_artifact_name: repo-review-automation-coverage-xml
      coverage_report_filename: coverage.xml
      debug_artifacts: true
