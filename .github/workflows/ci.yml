name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        shell: bash
        run: ruff check .

      - name: Pytest
        shell: bash
        run: pytest -q

      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q scripts tests repo_review_automation

      - name: Collector smoke test
        shell: bash
        run: |
          bash scripts/collect_signals.sh \
            --repo-root . \
            --paths . \
            --output-dir /tmp/repo-review-signals
          test -f /tmp/repo-review-signals/metadata.json
          test -f /tmp/repo-review-signals/file_inventory.txt

      - name: Context builder smoke test
        shell: bash
        run: |
          python scripts/build_review_context.py \
            --artifacts-dir /tmp/repo-review-signals \
            --repo-root . \
            --paths . \
            --review-mode full \
            --max-issues 5 \
            --prompt-preset default \
            --output /tmp/repo-review-context.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/repo-review-context.json").read_text(encoding="utf-8"))
          assert payload["repo"]["name"] == "repo-review-automation"
          assert "signals" in payload
          PY
