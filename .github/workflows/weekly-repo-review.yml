name: Weekly Repo Review

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  security-events: read

jobs:
  weekly-review:
    uses: shaypal5/repo-review-automation/.github/workflows/repo-review.yml@main
    with:
      create_issues: true
    secrets: inherit
